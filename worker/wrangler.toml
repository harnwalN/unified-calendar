name = "unified-calendar-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public config. GOOGLE_CLIENT_SECRET is a secret: `wrangler secret put GOOGLE_CLIENT_SECRET`
# (local dev reads it from .dev.vars – see .dev.vars.example).
[vars]
GOOGLE_CLIENT_ID = ""
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
